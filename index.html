        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap');

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }

    </style>
</head>
<body class="text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        // 2026.03.01 패턴에 레이어적용
        // -----------------------------------------------------------------------------
        // 1. Data Definitions
        // -----------------------------------------------------------------------------
        const CATEGORIES_DATA = {

        const THEME_COLORS_FULL = {

            vividPastels: ["#CCFF90", "#B6FF6C", "#A1FF49", "#8BFF26", "#76FF03", "#84FFFF", "#63F8FF", "#42F2FF", "#21EBFF", "#00E5FF", "#FF80AB", "#FC6096", "#FA4081", "#F7206C", "#F50057", "#EA80FC", "#E460FB", "#DF40FA", "#DA20F9", "#D500F9", "#FFFF8D", "#FFF969", "#FFF446", "#FFEF23", "#FFEA00", "#B2FF59", "#9EF648", "#8BEE38", "#77E527", "#64DD17", "#FFCA28", "#FFBB1E", "#FFAC14", "#FF9D0A", "#FF8F00"],
            warmTones: ["#FFF9C4", "#FEEDA5", "#FDE287", "#FCD669", "#FBCB4B", "#FBC02D", "#FFECB3", "#FFDC8F", "#FFCD6B", "#FFBE47", "#FFAF23", "#FFA000", "#FFE0B2", "#FDCC8E", "#FBB86A", "#F9A447", "#F79023", "#F57C00", "#FFCCBC", "#FAB29B", "#F5987A", "#F07E5A", "#EB6439", "#E64A19", "#D7CCC8", "#C4B4AE", "#B19C94", "#9E847B", "#8B6C61", "#795548", "#FFAB91", "#F79678", "#EF815F", "#E76C46", "#DF572D", "#D84315"],
            earthyTones: ["#E8F5E9", "#C4E0C6", "#A1CBA3", "#7EB781", "#5BA25E", "#388E3C", "#F1F8E9", "#D5E6C5", "#BAD4A2", "#9EC27E", "#83B05B", "#689F38", "#F9FBE7", "#EAECC1", "#DBDE9B", "#CCD076", "#BDC250", "#AFB42B", "#E0F2F1", "#B3D9D6", "#86C1BB", "#59A9A0", "#2C9185", "#00796B", "#DCEDC8", "#C1D9A9", "#A6C58A", "#8BB26C", "#709E4D", "#558B2F", "#8D6E63", "#806258", "#73564D", "#674B43", "#5A3F38", "#4E342E"],
            neutralTones: ["#CFD8DC", "#B3BEC4", "#97A5AC", "#7C8C94", "#60737C", "#455A64", "#F5F5F5", "#D7D7D7", "#B9B9B9", "#9C9C9C", "#7E7E7E", "#616161", "#EFEBE9", "#D1C8C5", "#B4A6A1", "#97847E", "#7A625A", "#5D4037", "#FAFAFA", "#EEEEEE", "#424242", "#373737", "#2C2C2C", "#212121", "#FFFFFF", "#000000", "#D7CCC8", "#C8B9B3", "#B9A69F", "#AA938B", "#9B8077", "#8D6E63"]
        };

        const initialPatterns = [
            // 🌟 다중 레이어(Multi-Layer)가 적용된 강력한 프리셋들
            {
                name: '우주 은하수 (Galaxy Burst)',
                layers: [
                    { type: 'wave', waveCount: 2, frequency: 0.8, amplitude: 60.0, curvature: 0.5, blendMode: 'overlay', opacity: 0.2, blur: 15, yOffset: 0 },
                    { type: 'shape', distribution: 'path', blendMode: 'screen', shape: ['star', 'sparkle'], pathType: 'spiral', spread: 80, count: 150, points: 5, minSize: 5.0, maxSize: 30.0, opacity: 0.5, blur: 1 },
                    { type: 'shape', distribution: 'cluster', blendMode: 'lighter', shape: ['circle'], clusterCount: 3, spread: 60, count: 200, minSize: 2.0, maxSize: 8.0, opacity: 0.3, blur: 2 }
                ]
            },
            {
                name: '심해 보케 (Deep Bokeh)',
                layers: [
                    { type: 'shape', distribution: 'poisson', blendMode: 'screen', shape: ['circle'], count: 80, minDistance: 30, minSize: 20.0, maxSize: 80.0, opacity: 0.1, blur: 8 },
                    { type: 'shape', distribution: 'noise', blendMode: 'lighter', shape: ['shimmer', 'circle'], count: 120, noiseScale: 0.015, noiseThreshold: 0.5, minSize: 5.0, maxSize: 25.0, opacity: 0.3, blur: 2 }
                ]
            },
            {
                name: '햇빛 반사 (Sunlight)',
                layers: [
                    { type: 'shape', distribution: 'noise', blendMode: 'screen', shape: ['shimmer', 'sparkle'], count: 180, noiseScale: 0.02, noiseThreshold: 0.35, minSize: 15.0, maxSize: 60.0, opacity: 0.15, blur: 1 }
                ]
            },
            {
                name: '마법의 숲 (Magic Forest)',
                layers: [
                    { type: 'shape', distribution: 'poisson', blendMode: 'source-over', shape: ['leaf', 'drop', 'sparkle'], count: 150, minDistance: 20, minSize: 10.0, maxSize: 25.0, opacity: 0.35, blur: 0 }
                ]
            },
            {
                name: '파티 컨페티 (Confetti)',
                layers: [
                    { type: 'shape', distribution: 'grid', blendMode: 'source-over', shape: ['circle', 'triangle', 'rectangle'], count: 80, cols: 10, rows: 5, posJitter: 0.8, sizeJitter: 0.6, minSize: 10.0, maxSize: 20.0, cornerRadius: 2.0, opacity: 0.4, blur: 0 }
                ]
            },
            {
                name: '해바라기 나선 (Phyllotaxis)',
                layers: [
                    { type: 'shape', distribution: 'phyllotaxis', blendMode: 'source-over', shape: ['circle'], count: 300, phySpread: 12, minSize: 4.0, maxSize: 20.0, opacity: 0.35, blur: 0 }
                ]
            },
            {
                name: '기본 물결 (Wave)',
                layers: [
                    { type: 'wave', waveCount: 4, frequency: 1.2, amplitude: 25.0, curvature: 0.3, blendMode: 'source-over', opacity: 0.15, blur: 0, yOffset: 0 }
                ]
            }
        ];

        // -----------------------------------------------------------------------------
        // 2. Core Engines
        // -----------------------------------------------------------------------------
        const calculateOverlayColor = (hex) => {
            if (!hex) return { type: 'rgba', r: 255, g: 255, b: 255, a: 0.15, rule: 'Default' };
            let cleanHex = hex.replace('#', '');
            let r = parseInt(cleanHex.slice(0, 2), 16) / 255;
            let g = parseInt(cleanHex.slice(2, 4), 16) / 255;
            let b = parseInt(cleanHex.slice(4, 6), 16) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            const luma = 0.299 * r + 0.587 * g + 0.114 * b;
            if (luma < 0.25) return { type: 'rgba', r: 255, g: 255, b: 255, a: 0.15, rule: 'Midnight Glow' };
            if (luma < 0.6) return { type: 'rgba', r: 255, g: 255, b: 255, a: s > 0.5 ? 0.40 : 0.25, rule: s > 0.5 ? 'Neon Pop' : 'Muted Elegance' };
            if (luma < 0.85) return { type: 'hsla', h: h * 360, s: (s * 0.5) * 100, l: (l * 2.0) * 100, a: 0.35, rule: 'Pigment Tint' };
            
            let newL = Math.max(0.2, l - 0.45); 
            let newS = s === 0 ? 0 : Math.min(1.0, s + 0.3); 
            let finalH = h * 360;
            if (s > 0.05 && finalH >= 40 && finalH <= 75) finalH = Math.max(0, finalH - 18);
            return { type: 'hsla', h: finalH, s: newS * 100, l: newL * 100, a: 0.15, rule: 'Deep Tone-on-Tone' };
        };

        const noise2D = (x, y) => {
            const fract = (n) => n - Math.floor(n);
            const rand = (a, b) => fract(Math.sin(a * 12.9898 + b * 78.233) * 43758.5453);
            const ix = Math.floor(x); const iy = Math.floor(y);
            const fx = fract(x); const fy = fract(y);
            const a = rand(ix, iy); const b = rand(ix + 1, iy);
            const c = rand(ix, iy + 1); const d = rand(ix + 1, iy + 1);
            const ux = fx * fx * (3 - 2 * fx); const uy = fy * fy * (3 - 2 * fy);
            return a + (b - a) * ux + (c - a) * uy * (1 - ux) + (d - c) * ux * uy;
        };

        const DistributionEngine = {
            generate: (distType, count, width, height, params, random) => {
                const points = [];
                if (distType === 'poisson') {
                    const minDist = params.minDistance || 25;
                    const maxAttempts = count * 10;
                    for (let i = 0; i < maxAttempts; i++) {
                        if (points.length >= count) break;
                        let x = random() * width; let y = random() * height;
                        let valid = true;
                        for (let p of points) {
                            if (Math.hypot(p.x - x, p.y - y) < minDist) { valid = false; break; }
                        }
                        if (valid) points.push({ x, y, scale: 0.5 + random()*0.5 });
                    }
                } 
                else if (distType === 'noise') {
                    const scale = params.noiseScale || 0.015;
                    const threshold = params.noiseThreshold || 0.45;
                    const maxAttempts = count * 5;
                    for(let i=0; i<maxAttempts; i++) {
                        if (points.length >= count) break;
                        let x = random() * width; let y = random() * height;
                        let n = noise2D(x * scale, y * scale);
                        if (n > threshold) points.push({ x, y, scale: n }); 
                    }
                } 
                else if (distType === 'path') {
                    const pathType = params.pathType || 'sine';
                    const spread = params.spread || 50;
                    for(let i=0; i<count; i++) {
                        let t = random(); 
                        let px, py;
                        if (pathType === 'sine') {
                            px = t * width; py = height/2 + Math.sin(t * Math.PI * 4) * (height/3);
                        } else if (pathType === 'spiral') {
                            let angle = t * Math.PI * 8;
                            let radius = t * Math.min(width, height)/1.5;
                            px = width/2 + Math.cos(angle)*radius; py = height/2 + Math.sin(angle)*radius;
                        } else { 
                            px = t * width; py = t * height;
                        }
                        let angle = random() * Math.PI * 2;
                        let dist = random() * spread;
                        points.push({ x: px + Math.cos(angle)*dist, y: py + Math.sin(angle)*dist, scale: Math.max(0.1, 1 - (dist/spread)*0.8) });
                    }
                } 
                else if (distType === 'grid') {
                    const cols = params.cols || 8; const rows = params.rows || 4;
                    const cellW = width / cols; const cellH = height / rows;
                    const pJitter = params.posJitter || 0.5; const sJitter = params.sizeJitter || 0.5;
                    for(let r=0; r<rows; r++) {
                        for(let c=0; c<cols; c++) {
                            let cx = c * cellW + cellW/2; let cy = r * cellH + cellH/2;
                            let jx = (random() - 0.5) * cellW * pJitter; let jy = (random() - 0.5) * cellH * pJitter;
                            let scale = 1.0 + (random() - 0.5) * sJitter;
                            points.push({ x: cx + jx, y: cy + jy, scale });
                        }
                    }
                }
                else if (distType === 'phyllotaxis') {
                    const c = params.phySpread || 15;
                    for (let i = 0; i < count; i++) {
                        let r = c * Math.sqrt(i);
                        let theta = i * 137.508 * (Math.PI / 180);
                        points.push({
                            x: width/2 + r * Math.cos(theta), 
                            y: height/2 + r * Math.sin(theta), 
                            scale: Math.max(0.3, 1.0 - (i/count)*0.5)
                        });
                    }
                }
                else if (distType === 'symmetry') {
                    const rings = params.rings || 5;
                    const sym = params.symmetry || 8;
                    const ringSpacing = params.spread || 40;
                    points.push({x: width/2, y: height/2, scale: 1.0});
                    for(let r=1; r<=rings; r++) {
                        let radius = r * ringSpacing;
                        let ringPoints = sym * r; 
                        for(let s=0; s<ringPoints; s++) {
                            let angle = (s / ringPoints) * Math.PI * 2;
                            points.push({ x: width/2 + Math.cos(angle)*radius, y: height/2 + Math.sin(angle)*radius, scale: 1.0 - (r/(rings+1))*0.4 });
                        }
                    }
                }
                else if (distType === 'cluster') {
                    const clusters = params.clusterCount || 3;
                    const cSpread = params.spread || 80;
                    const centers = [];
                    for(let i=0; i<clusters; i++) {
                        centers.push({x: width*0.1 + random()*width*0.8, y: height*0.1 + random()*height*0.8});
                    }
                    for(let i=0; i<count; i++) {
                        let center = centers[Math.floor(random()*clusters)];
                        let angle = random() * Math.PI * 2;
                        let dist = random() * random() * cSpread; 
                        points.push({ x: center.x + Math.cos(angle)*dist, y: center.y + Math.sin(angle)*dist, scale: Math.max(0.2, 1.0 - (dist/cSpread)*0.6) });
                    }
                }
                else {
                    let weights = params.gridWeights || [1, 1, 1, 1, 1, 1, 1, 1, 1];
                    const totalW = weights.reduce((sum, w) => sum + w, 0);
                    for(let i=0; i<count; i++) {
                        let pick = random() * (totalW || 1);
                        let zIdx = 0;
                        for (let j=0; j<9; j++) { pick -= weights[j]; if(pick <= 0){ zIdx = j; break; } }
                        let zx = zIdx % 3; let zy = Math.floor(zIdx / 3);
                        let dx = (zx * (width/3)) + (random() * (width/3));
                        let dy = (zy * (height/3)) + (random() * (height/3));
                        let scale = 1.0;
                        if(params.flowScale) {
                            let prog = 0; let ds = params.flowScale.dir || 'NONE';
                            if(ds==='TL_BR') prog = ((dx/width)+(dy/height))/2;
                            else if(ds==='TR_BL') prog = ((1-(dx/width))+(dy/height))/2;
                            else if(ds==='T_B') prog = dy/height;
                            else if(ds==='B_T') prog = 1.0 - (dy/height);
                            else if(ds==='L_R') prog = dx/width;
                            else if(ds==='R_L') prog = 1.0 - (dx/width);
                            else if(ds==='C_OUT') prog = Math.min(1, Math.sqrt(Math.pow((dx/width)-0.5, 2) + Math.pow((dy/height)-0.5, 2)) * 1.414);
                            scale = params.flowScale.range[0] + (params.flowScale.range[1]-params.flowScale.range[0])*Math.max(0,Math.min(1,prog));
                        }
                        points.push({ x: dx, y: dy, scale });
                    }
                }
                return points;
            }
        };

        const Icon = ({ name, size = 18, color = 'currentColor', className = '' }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide && window.lucide.icons[name]) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current, nameAttr: 'data-lucide',
                        attrs: { width: size, height: size, stroke: color, class: className, 'stroke-width': 2.5 }
                    });
                }
            }, [name, size, color, className]);
            return <span ref={spanRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const getParamConfig = (key) => {
            switch (key) {
                case 'count': return { min: 1, max: 3000, step: 1 };
                case 'waveCount': return { min: 1, max: 20, step: 1 };
                case 'blur': return { min: 0, max: 50, step: 0.5 };
                case 'frequency': return { min: 0.1, max: 10, step: 0.1 };
                case 'points': return { min: 3, max: 20, step: 1 };
                case 'amplitude': return { min: 0, max: 300, step: 1 };
                case 'curvature': return { min: -2, max: 2, step: 0.01 };
                case 'opacity': return { min: 0, max: 1, step: 0.01 };
                case 'yOffset': return { min: -1, max: 1, step: 0.01 };
                case 'minSize': case 'maxSize': return { min: 1, max: 300, step: 1 };
                case 'cornerRadius': return { min: 0, max: 100, step: 1 };
                case 'minDistance': return { min: 5, max: 100, step: 1 };
                case 'noiseScale': return { min: 0.001, max: 0.05, step: 0.001 };
                case 'noiseThreshold': return { min: 0.1, max: 0.9, step: 0.01 };
                case 'spread': return { min: 5, max: 300, step: 1 };
                case 'cols': case 'rows': return { min: 1, max: 30, step: 1 };
                case 'posJitter': case 'sizeJitter': return { min: 0, max: 2, step: 0.05 };
                case 'phySpread': return { min: 1, max: 50, step: 0.5 };
                case 'rings': return { min: 1, max: 15, step: 1 };
                case 'symmetry': return { min: 3, max: 24, step: 1 };
                case 'clusterCount': return { min: 1, max: 10, step: 1 };
                default: return { min: 0, max: 100, step: 1 };
            }
        };

        const PatternCanvas = ({ theme, layers, engineRule, width, height }) => {
            const canvasRef = useRef(null);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                canvas.width = width * dpr; canvas.height = height * dpr;
                ctx.scale(dpr, dpr); ctx.clearRect(0, 0, width, height);
                
                const drawColor = (elementOpacity) => {
                    const finalAlpha = engineRule.a * elementOpacity;
                    if (engineRule.type === 'rgba') return `rgba(${engineRule.r}, ${engineRule.g}, ${engineRule.b}, ${finalAlpha})`;
                    return `hsla(${engineRule.h}, ${engineRule.s}%, ${engineRule.l}%, ${finalAlpha})`;
                };
                
                // 🌟 순차적으로 레이어를 겹쳐서 렌더링
                layers.forEach((layer, index) => {
                    // 각 레이어마다 고유의 시드값을 주어 서로 렌더링에 간섭하지 않게 함
                    let seed = 123 + (index * 1000);
                    const random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
                    
                    ctx.save();
                    ctx.globalCompositeOperation = layer.blendMode || 'source-over';
                    ctx.filter = `blur(${layer.blur || 0}px)`;

                    if (layer.type === 'wave') {
                        const waveCount = layer.waveCount || 3;
                        const amplitude = layer.amplitude || 10;
                        const frequency = layer.frequency || 1;
                        const curvature = layer.curvature || 0;
                        for (let i = 0; i < waveCount; i++) {
                            ctx.beginPath();
                            const baseY = height * (0.3 + i * 0.15 + (layer.yOffset||0));
                            ctx.moveTo(0, baseY);
                            for (let x = 0; x <= width + 5; x += 5) {
                                const nx = x / width;
                                const distortedNx = nx + (curvature * 0.3) * Math.sin(nx * Math.PI * 2);
                                const y = baseY + Math.sin(distortedNx * Math.PI * 2 * frequency) * amplitude;
                                ctx.lineTo(x, y);
                            }
                            ctx.lineTo(width, height); ctx.lineTo(0, height);
                            const g = ctx.createLinearGradient(0, 0, 0, height); 
                            g.addColorStop(0, drawColor(0)); g.addColorStop(1, drawColor(layer.opacity || 0.2));
                            ctx.fillStyle = g; ctx.fill();
                        }
                    } else {
                        // Shape Distribution
                        const dist = layer.distribution || 'random';
                        const count = layer.count || 10;
                        const points = DistributionEngine.generate(dist, count, width, height, layer, random);
                        const shapePool = Array.isArray(layer.shape) ? layer.shape : [layer.shape || 'circle'];

                        for (let p of points) {
                            const minS = layer.minSize || 10; 
                            const maxS = layer.maxSize || 20;
                            const s = (minS + random() * (maxS - minS)) * p.scale;
                            const currentShape = shapePool[Math.floor(random() * shapePool.length)];
                            
                            ctx.save(); 
                            ctx.translate(p.x, p.y); 
                            ctx.rotate(random() * Math.PI * 2); 
                            
                            if(currentShape === 'shimmer') {
                                ctx.fillStyle = drawColor(layer.opacity || 0.2);
                                ctx.fillRect(-s/2, -s/2, s, s);
                                ctx.beginPath();
                                ctx.fillStyle = drawColor((layer.opacity || 0.2) * 1.8);
                                ctx.rotate(Math.PI / 4);
                                const ins = s * 0.7;
                                ctx.rect(-ins/2, -ins/2, ins, ins);
                                ctx.fill();
                            } else {
                                ctx.fillStyle = drawColor(layer.opacity || 0.2);
                                ctx.beginPath();
                                if(currentShape === 'circle') {
                                    ctx.arc(0, 0, s/2, 0, Math.PI*2);
                                } else if(currentShape === 'rectangle') {
                                    if (layer.cornerRadius > 0) ctx.roundRect(-s/2, -s/2, s, s, layer.cornerRadius * p.scale);
                                    else ctx.rect(-s/2, -s/2, s, s);
                                } else if(currentShape === 'star') {
                                    const pts = layer.points || 5;
                                    ctx.moveTo(0, -s/2);
                                    for (let j = 0; j < pts * 2; j++) {
                                        const r = j % 2 === 0 ? s/2 : (s/2) * 0.4; const a = (j * Math.PI / pts) - Math.PI/2;
                                        ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
                                    }
                                } else if(currentShape === 'heart') {
                                    ctx.moveTo(0, -s * 0.2);
                                    ctx.bezierCurveTo(s * 0.55, -s * 0.6, s * 0.55, s * 0.1, 0, s * 0.45);
                                    ctx.bezierCurveTo(-s * 0.55, s * 0.1, -s * 0.55, -s * 0.6, 0, -s * 0.2);
                                } else if(currentShape === 'heart_outline') {
                                    ctx.moveTo(0, -s * 0.2);
                                    ctx.bezierCurveTo(s * 0.55, -s * 0.6, s * 0.55, s * 0.1, 0, s * 0.45);
                                    ctx.bezierCurveTo(-s * 0.55, s * 0.1, -s * 0.55, -s * 0.6, 0, -s * 0.2);
                                    const ins = s * 0.7; const yOff = -s * 0.05;
                                    ctx.moveTo(0, ins * 0.45 + yOff);
                                    ctx.bezierCurveTo(ins * 0.55, ins * 0.1 + yOff, ins * 0.55, -ins * 0.6 + yOff, 0, -ins * 0.2 + yOff);
                                    ctx.bezierCurveTo(-ins * 0.55, -ins * 0.6 + yOff, -ins * 0.55, ins * 0.1 + yOff, 0, ins * 0.45 + yOff);
                                } else if(currentShape === 'heart_slim') {
                                    ctx.moveTo(0, -s * 0.2);
                                    ctx.bezierCurveTo(s * 0.4, -s * 0.6, s * 0.45, s * 0.1, 0, s * 0.6);
                                    ctx.bezierCurveTo(-s * 0.45, s * 0.1, -s * 0.4, -s * 0.6, 0, -s * 0.2);
                                } else if(currentShape === 'heart_wide') {
                                    ctx.moveTo(0, -s * 0.2);
                                    ctx.bezierCurveTo(s * 0.8, -s * 0.6, s * 0.9, s * 0.1, 0, s * 0.45);
                                    ctx.bezierCurveTo(-s * 0.9, s * 0.1, -s * 0.8, -s * 0.6, 0, -s * 0.2);
                                } else if(currentShape === 'cloud') {
                                    ctx.arc(-s/6, 0, s/6, 0, Math.PI*2); ctx.arc(s/6, 0, s/6, 0, Math.PI*2); ctx.arc(0, -s/8, s/5, 0, Math.PI*2);
                                } else if(currentShape === 'triangle') {
                                    ctx.moveTo(0, -s/2); ctx.lineTo(s/2, s/2); ctx.lineTo(-s/2, s/2);
                                } else if(currentShape === 'hexagon') {
                                    for (let j = 0; j < 6; j++) { const a = j * Math.PI / 3; ctx.lineTo(s/2 * Math.cos(a), s/2 * Math.sin(a)); }
                                } else if(currentShape === 'diamond') {
                                    ctx.moveTo(0, -s/2); ctx.lineTo(s/2, 0); ctx.lineTo(0, s/2); ctx.lineTo(-s/2, 0);
                                } else if(currentShape === 'sparkle') {
                                    ctx.moveTo(0, -s/2);
                                    ctx.quadraticCurveTo(s/8, -s/8, s/2, 0);
                                    ctx.quadraticCurveTo(s/8, s/8, 0, s/2);
                                    ctx.quadraticCurveTo(-s/8, s/8, -s/2, 0);
                                    ctx.quadraticCurveTo(-s/8, -s/8, 0, -s/2);
                                } else if(currentShape === 'leaf') {
                                    ctx.moveTo(0, -s/2);
                                    ctx.bezierCurveTo(s/2, -s/4, s/2, s/4, 0, s/2);
                                    ctx.bezierCurveTo(-s/2, s/4, -s/2, -s/4, 0, -s/2);
                                } else if(currentShape === 'drop') {
                                    ctx.moveTo(0, -s/2);
                                    ctx.bezierCurveTo(s/2, -s/8, s/2, s/2, 0, s/2);
                                    ctx.bezierCurveTo(-s/2, s/2, -s/2, -s/8, 0, -s/2);
                                } else {
                                    ctx.arc(0, 0, s/2, 0, Math.PI*2);
                                }
                                ctx.closePath();
                                ctx.fill(); 
                            }
                            ctx.restore();
                        }
                    }
                    ctx.restore();
                });

            }, [theme, layers, engineRule, width, height]);
            return <canvas ref={canvasRef} style={{ width: '100%', height: '100%' }} className="block" />;
        };

        // -----------------------------------------------------------------------------
        // 3. Main App Component

                    if (dist === 'grid' && newLayer.cols === undefined) { newLayer.cols = 8; newLayer.rows = 4; newLayer.posJitter = 0.6; newLayer.sizeJitter = 0.5; }
                    if (dist === 'random' && newLayer.gridWeights === undefined) { newLayer.gridWeights = [1,1,1,1,1,1,1,1,1]; newLayer.flowScale = {dir: 'NONE', range: [1,1]}; }
                    if (dist === 'phyllotaxis' && newLayer.phySpread === undefined) newLayer.phySpread = 12;
                    if (dist === 'symmetry' && newLayer.rings === undefined) { newLayer.rings = 5; newLayer.symmetry = 8; newLayer.spread = 35; }

            const getVisibleParams = () => {

                else if (dist === 'grid') specifics = ['count', 'cols', 'rows', 'posJitter', 'sizeJitter'];
                else if (dist === 'random') specifics = ['count', 'gridWeights', 'flowScale'];
                else if (dist === 'phyllotaxis') specifics = ['count', 'phySpread'];
                else if (dist === 'symmetry') specifics = ['rings', 'symmetry', 'spread']; 
                else if (dist === 'cluster') specifics = ['count', 'clusterCount', 'spread'];

                let shapeSpecifics = [];
                if (currentShapes.includes('star')) shapeSpecifics.push('points');
                if (currentShapes.includes('rectangle')) shapeSpecifics.push('cornerRadius');

                const orderedKeys = ['blendMode', 'shape', ...specifics, 'minSize', 'maxSize', ...shapeSpecifics, 'blur', 'opacity'];
                return orderedKeys.filter(k => activeLayer[k] !== undefined);
            };

            const visibleKeys = getVisibleParams();
            const availableShapes = [
                {v: 'circle', l: '원형'}, {v: 'triangle', l: '삼각형'}, {v: 'hexagon', l: '육각형'}, {v: 'diamond', l: '마름모'},

            return (

                            <div className="w-full max-w-[500px] mx-auto bg-white p-6 lg:p-7 rounded-[28px] border border-gray-100 shadow-lg flex flex-col mb-10 lg:mb-0">
                                
                                {/* 🌟 레이어 관리자 UI */}
                                <div className="flex flex-col gap-3 mb-6 border-b border-gray-50 pb-5">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-sm font-black uppercase flex items-center gap-2 tracking-widest text-gray-800"><Icon name="Layers" size={16} color="#3b82f6" /> Layer Editor</h3>
                                        <div className="flex gap-2">
                                            <button onClick={() => copyToClipboard(layers, 'EDITOR')} className={`text-[10px] px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1 ${copyStatus === 'EDITOR' ? 'bg-emerald-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                                                <Icon name={copyStatus === 'EDITOR' ? 'Check' : 'Copy'} size={12} /> {copyStatus === 'EDITOR' ? '복사됨' : '복사'}
                                            </button>
                                            <button onClick={handleSavePattern} className="text-[10px] px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-bold flex items-center gap-1 shadow-sm">
                                                <Icon name="Save" size={12} /> 저장

                                    {/* 탭 형태의 레이어 선택기 */}
                                    <div className="flex flex-wrap gap-2 items-center bg-gray-50 p-2 rounded-xl border border-gray-100">
                                        {layers.map((layer, idx) => (
                                            <div key={idx} className="relative group">
                                                <button onClick={() => setActiveLayerIndex(idx)} 
                                                    className={`px-3 py-1.5 text-[11px] font-bold rounded-lg transition-all ${idx === activeLayerIndex ? 'bg-blue-500 text-white shadow-md' : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200'}`}>
                                                    Layer {idx + 1}
                                                </button>
                                                {layers.length > 1 && (
                                                    <button onClick={(e) => { e.stopPropagation(); removeLayer(idx); }} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition-opacity shadow-sm">
                                                        <Icon name="X" size={10} />

                                        <button onClick={addLayer} className="px-2 py-1.5 text-[11px] font-bold rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-all border border-indigo-100 flex items-center gap-1">
                                            <Icon name="Plus" size={12} /> Add
                                        </button>

                                </div>

                                <div className="flex flex-col gap-4">
                                    {activeLayer && (
                                        <>
                                            {/* 🌟 통합 레이어 종류 & 배치 방식 드롭다운 */}
                                            <div className="py-2 mb-2 border-b border-gray-100 pb-5">
                                                <span className="text-[10px] font-bold text-indigo-500 uppercase tracking-wider block mb-2">레이어 종류 및 배치 방식</span>
                                                <select value={activeLayer.type === 'wave' ? 'wave' : activeLayer.distribution} onChange={(e) => handleTypeChange(e.target.value)} className="w-full text-xs font-bold border-2 border-indigo-100 rounded-xl px-3 py-2.5 outline-none bg-indigo-50/50 focus:ring-2 focus:ring-indigo-500 transition-all text-indigo-900 cursor-pointer shadow-sm">
                                                    <optgroup label="곡선 (Curve)">
                                                        <option value="wave">〰️ 기본 물결 (Wave)</option>
                                                    </optgroup>
                                                    <optgroup label="도형 배치 (Shapes)">
                                                        <option value="phyllotaxis">🌻 해바라기 나선 (Phyllotaxis)</option>
                                                        <option value="symmetry">🌸 만다라 대칭 (Radial Symmetry)</option>
                                                        <option value="cluster">🌌 중력 성단 (Gravity Clusters)</option>
                                                        <option value="poisson">💧 푸아송 디스크 (Poisson)</option>
                                                        <option value="noise">☁️ 노이즈 맵 (Noise)</option>

                                            </div>

                                            {visibleKeys.map((key) => {

                                                if (key === 'blendMode') return (
                                                    <div key={key} className="py-2 mb-2 border-b border-gray-100 pb-5">
                                                        <span className="text-[10px] font-bold text-purple-500 uppercase tracking-wider block mb-2">{paramLabels[key]}</span>
                                                        <select value={value || 'source-over'} onChange={(e) => handleParamChange(key, e.target.value)} className="w-full text-xs font-bold border-2 border-purple-100 rounded-xl px-3 py-2.5 outline-none bg-purple-50/50 focus:ring-2 focus:ring-purple-500 transition-all text-purple-900 cursor-pointer shadow-sm">
                                                            <option value="source-over">기본 (Normal)</option>
                                                            <option value="screen">스크린 (Screen - 빛 반사)</option>
                                                            <option value="lighter">밝게 (Lighter - 강렬한 빛)</option>
                                                            <option value="multiply">곱하기 (Multiply - 물감 섞임)</option>
                                                            <option value="overlay">오버레이 (Overlay - 톤 대비)</option>
                                                        </select>
                                                    </div>
                                                );

                                                if (key === 'shape') {
                                                    const currentShapes = Array.isArray(value) ? value : [value || 'circle'];
                                                    return (
                                                        <div key={key} className="py-2 mb-2 border-b border-gray-100 pb-5">
                                                            <span className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider block mb-3">{paramLabels[key]}</span>
                                                            <div className="flex flex-wrap gap-2">
                                                                {availableShapes.map(s => {
                                                                    const isSelected = currentShapes.includes(s.v);
                                                                    return (
                                                                        <button key={s.v} onClick={() => handleShapeToggle(s.v)} className={`px-3 py-1.5 text-[10px] font-bold rounded-lg transition-all border ${isSelected ? 'bg-emerald-500 text-white border-emerald-600 shadow-md' : 'bg-white text-gray-500 border-gray-200 hover:border-emerald-300 hover:text-emerald-600'}`}>
                                                                            {s.l}
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                }
                                                
                                                if (key === 'pathType') return (
                                                    <div key={key} className="flex justify-between items-center py-2 border-t border-gray-50 mt-1 pt-3">
                                                        <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">{paramLabels[key]}</span>
                                                        <select value={value || 'sine'} onChange={(e) => handleParamChange(key, e.target.value)} className="text-[11px] font-bold border border-gray-200 rounded-lg px-2 py-1.5 outline-none bg-gray-50 focus:ring-2 focus:ring-blue-500 transition-all">
                                                            <option value="sine">사인 곡선 (물결)</option>
                                                            <option value="spiral">나선형 (소용돌이)</option>
                                                            <option value="line">직선 (사선)</option>
                                                        </select>
                                                    </div>
                                                );

                                                if (key === 'gridWeights') return (
                                                    <div key={key} className="py-2 border-t border-gray-50">
                                                        <span className="text-[10px] font-bold text-gray-400 block mb-2 uppercase tracking-wider">{paramLabels[key]}</span>
                                                        <div className="grid grid-cols-3 gap-2">
                                                            {value.map((w, i) => <input key={i} type="number" value={w} onChange={(e) => { const nw = [...value]; nw[i] = parseInt(e.target.value) || 0; handleParamChange(key, nw); }} className="w-full bg-gray-50 border border-gray-200 text-xs text-center font-mono py-2 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all" />)}
                                                        </div>
                                                    </div>
                                                );
                                                
                                                if (key === 'flowScale') return (
                                                    <div key={key} className="py-2 border-t border-gray-50 mt-1 pt-4">
                                                        <div className="flex justify-between items-center mb-3">
                                                            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">{paramLabels[key]}</span>
                                                            <select value={value.dir} onChange={(e) => handleParamChange(key, { ...value, dir: e.target.value })} className="text-[11px] font-bold border border-gray-200 rounded-lg px-2 py-1.5 outline-none bg-gray-50 focus:ring-2 focus:ring-blue-500 transition-all">
                                                                {[{v: 'NONE', l: '없음'}, {v: 'TL_BR', l: '좌상 ➔ 우하'}, {v: 'TR_BL', l: '우상 ➔ 좌하'}, {v: 'T_B', l: '위 ➔ 아래'}, {v: 'B_T', l: '아래 ➔ 위'}, {v: 'L_R', l: '좌 ➔ 우'}, {v: 'R_L', l: '우 ➔ 좌'}, {v: 'C_OUT', l: '중앙 ➔ 바깥'}].map(d => <option key={d.v} value={d.v}>{d.l}</option>)}
                                                            </select>
                                                        </div>
                                                        <div className="flex gap-5">
                                                            {['시작 크기', '종료 크기'].map((l, idx) => (
                                                                <div key={l} className="flex-1"><span className="text-[10px] font-bold text-gray-400 block mb-2">{l}: <span className="text-blue-500">{value.range[idx].toFixed(1)}</span></span>
                                                                    <input type="range" min="0" max="4" step="0.1" value={value.range[idx]} onChange={(e) => { const nr = [...value.range]; nr[idx] = parseFloat(e.target.value); handleParamChange(key, { ...value, range: nr }); }} className="w-full h-1.5 accent-blue-500" />
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                                
                                                if (typeof value === 'number') {
                                                    const config = getParamConfig(key);
                                                    const isGenerativeParam = ['minDistance', 'noiseScale', 'noiseThreshold', 'spread', 'phySpread', 'rings', 'symmetry', 'clusterCount', 'cols', 'rows', 'posJitter', 'sizeJitter'].includes(key);
                                                    return (
                                                        <div key={key} className={`py-1.5 border-t border-gray-50 mt-1 pt-3 ${isGenerativeParam ? 'bg-indigo-50/20 -mx-4 px-4 rounded-xl' : ''}`}>
                                                            <div className={`flex justify-between text-[11px] font-bold mb-2 uppercase tracking-wide ${isGenerativeParam ? 'text-indigo-600' : 'text-gray-700'}`}>
                                                                <span>{paramLabels[key] || key}</span>
                                                                <span className={`${isGenerativeParam ? 'text-indigo-700 bg-indigo-100' : 'text-blue-600 bg-blue-50'} px-2 py-0.5 rounded-lg`}>{value.toFixed(config.step < 1 ? 2 : 0)}</span>
                                                            </div>
                                                            <input type="range" min={config.min} max={config.max} step={config.step} value={value} onChange={(e) => handleParamChange(key, parseFloat(e.target.value))} className={`w-full h-1.5 ${isGenerativeParam ? 'accent-indigo-500' : 'accent-blue-500'}`} />
                                                        </div>
                                                    );
                                                }
                                                if (typeof value === 'boolean') return (
                                                    <div key={key} className="flex justify-between items-center py-2 border-t border-gray-50 mt-1 pt-3">
                                                        <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">{paramLabels[key] || key}</span>
                                                        <input type="checkbox" checked={value} onChange={(e) => handleParamChange(key, e.target.checked)} className="accent-blue-500 w-4 h-4" />
                                                    </div>
                                                );
                                                return null;
                                            })}
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Right Column: Unified Assets Library */}
                    <div className={`w-full flex-1 lg:w-[35%] bg-white flex flex-col h-[50%] lg:h-full border-l border-gray-100 shadow-xl lg:shadow-none z-20 min-h-0 ${mobileTab !== 'editor' ? 'flex' : 'hidden'} lg:flex`}>
                        
                        <div className="hidden lg:block p-5 lg:p-6 pb-4 border-b border-gray-100 flex-shrink-0 bg-white">
                            <h2 className="text-lg font-black mb-4 tracking-tight flex items-center gap-2"><Icon name="Library" size={20} color="#64748b"/> Assets Library</h2>
                            <div className="flex gap-2 p-1.5 bg-gray-100/80 rounded-2xl">
                                <button onClick={() => setDesktopTab('colors')} 
                                    className={`flex-1 py-2.5 text-[11px] font-black uppercase tracking-wider rounded-xl transition-all flex justify-center items-center gap-2 ${desktopTab === 'colors' ? 'bg-white shadow-sm text-blue-600 ring-1 ring-black/5' : 'text-gray-400 hover:text-gray-600'}`}>
                                    <Icon name="Palette" size={14} /> 컬러
                                </button>
                                <button onClick={() => setDesktopTab('patterns')} 
                                    className={`flex-1 py-2.5 text-[11px] font-black uppercase tracking-wider rounded-xl transition-all flex justify-center items-center gap-2 ${desktopTab === 'patterns' ? 'bg-white shadow-sm text-blue-600 ring-1 ring-black/5' : 'text-gray-400 hover:text-gray-600'}`}>
                                    <Icon name="Box" size={14} /> 패턴 프리셋
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 custom-scrollbar pb-32">
                            
                            {/* Tab 1: COLORS */}
                            <div className={`${mobileTab === 'colors' ? 'block' : 'hidden'} ${desktopTab === 'colors' ? 'lg:block' : 'lg:hidden'} space-y-10 animate-in fade-in duration-300`}>
                                {Object.entries(THEME_COLORS_FULL).map(([catId, hexCodes]) => (
                                    <section key={catId}>
                                        <div className={`flex items-center gap-2 mb-4 font-black text-[10px] uppercase tracking-widest ${CATEGORIES_DATA[catId].color}`}>
                                            <div className="bg-current bg-opacity-10 p-1.5 rounded-lg"><Icon name={CATEGORIES_DATA[catId].icon} size={14} /></div>
                                            {CATEGORIES_DATA[catId].label}
                                            <div className="flex-1 h-px bg-gray-100 ml-2"></div>
                                        </div>
                                        <div className="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-5 gap-2.5">
                                            {hexCodes.map((hex, idx) => {
                                                const isActive = selectedTheme.color === hex;
                                                const colorInfo = calculateOverlayColor(hex);
                                                return (
                                                    <button key={idx} onClick={() => setSelectedTheme({ color: hex, text: colorInfo.luma > 0.6 ? "#333333" : "#FFFFFF", category: catId, name: `Theme ${hex}` })} 
                                                        className={`aspect-square rounded-xl transition-all duration-300 hover:scale-110 active:scale-95 border ${isActive ? 'ring-2 ring-offset-2 ring-blue-500 scale-105 z-10 shadow-lg border-transparent' : 'border-gray-100 hover:shadow-md'}`}
                                                        style={{ backgroundColor: hex }}>
                                                        {isActive && <Icon name="Check" size={14} color={colorInfo.luma > 0.6 ? "#333333" : "#FFFFFF"} className="mx-auto drop-shadow-md" />}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </section>
                                ))}
                            </div>

                            {/* Tab 2: PATTERNS */}
                            <div className={`${mobileTab === 'patterns' ? 'block' : 'hidden'} ${desktopTab === 'patterns' ? 'lg:block' : 'lg:hidden'} grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-4 animate-in fade-in duration-300`}>
                                {patterns.map((pat, idx) => {
                                    const isActive = selectedPatternBase.name === pat.name;
                                    const isCopied = copyStatus === pat.name;
                                    return (
                                        <div key={idx} onClick={() => setSelectedPatternBase(pat)} className={`group p-5 rounded-[28px] border cursor-pointer transition-all duration-300 flex flex-col relative ${isActive ? 'border-blue-500 bg-blue-50/30 ring-4 ring-blue-50 shadow-md' : 'bg-white border-gray-200 hover:border-gray-300 hover:bg-gray-50/50'}`}>
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="font-black uppercase tracking-tighter text-sm flex items-center gap-2">
                                                    <Icon name="Wand2" size={16} color={isActive ? '#3b82f6' : '#94a3b8'} />
                                                    {pat.name} {pat.isCustomized && <span className="text-[9px] text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full ml-1 font-black tracking-widest">MOD</span>}
                                                </span>
                                                <button onClick={(e) => { e.stopPropagation(); copyToClipboard(pat.layers, pat.name); }} className={`p-2 rounded-xl transition-all ${isCopied ? 'bg-emerald-500 text-white' : 'bg-white border border-gray-200 text-gray-500 hover:bg-gray-100 hover:text-blue-600 shadow-sm'}`}>
                                                    <Icon name={isCopied ? 'Check' : 'Copy'} size={14} />
                                                </button>
                                            </div>
                                            
                                            {/* Preview Code Snippet */}
                                            <div className={`text-[10px] font-mono p-4 rounded-2xl overflow-x-auto custom-scrollbar leading-relaxed border ${isActive ? 'bg-white text-blue-900 border-blue-100 shadow-inner' : 'bg-gray-50 text-gray-500 border-transparent'}`}>
                                                <div className="opacity-40 font-bold mb-1">layers: [</div>
                                                {pat.layers.map((layer, lIdx) => (
                                                    <div key={lIdx} className="mb-2 last:mb-0">
                                                        <div className="pl-2 opacity-50">{'{'}</div>
                                                        {Object.entries(layer).slice(0, 3).map(([k,v]) => (
                                                            <div key={k} className="pl-6 whitespace-nowrap"><span className={isActive ? 'text-blue-600' : 'text-gray-700 font-bold'}>'{k}'</span>: {formatValueForCopy(v)},</div>
                                                        ))}
                                                        {Object.keys(layer).length > 3 && <div className="pl-6 opacity-50">...</div>}
                                                        <div className="pl-2 opacity-50">{'}'}{lIdx < pat.layers.length - 1 ? ',' : ''}</div>
                                                    </div>
                                                ))}
                                                <div className="opacity-40 font-bold mt-1">]</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
